name: verify

on:
  push:
  pull_request:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Check application version consistency
        run: node scripts/version.mjs check

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            libxdo-dev librsvg2-dev patchelf libwebkit2gtk-4.1-dev

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --workspace
        env:
          # Integration tests compare exact fixture bytes. Windows runners may
          # inherit core.autocrlf=true, which rewrites those fixtures to CRLF.
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Check frontend
        run: npm run check
        working-directory: apps/desktop

      - name: Build frontend
        run: npm run build
        working-directory: apps/desktop
