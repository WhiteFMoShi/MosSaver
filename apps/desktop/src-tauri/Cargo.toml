[package]
name = "easilygit-desktop"
version.workspace = true
description = "Simple local version history for AI-assisted projects"
authors = ["MosSaver contributors"]
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "easilygit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
notify = "8"
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
easilygit-app = { path = "../../../crates/easilygit-app" }
easilygit-domain = { path = "../../../crates/easilygit-domain" }
easilygit-git = { path = "../../../crates/easilygit-git" }
